services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sira
      MYSQL_USER: sira
      MYSQL_PASSWORD: sira
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - sira_mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  sira_mysql:
